# Builds the stats, top-languages and contribution-snake images used in README.md
# and commits them to profile/. Generating them here (instead of linking to a
# public card server) means they never break from rate limits.

name: Profile cards

on:
  schedule:
    - cron: "30 0 * * *" # every day at 06:00 IST
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml", ".github/scripts/cards.py"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Stats and top-languages cards, light and dark. Colours match the banner.
      # Uses public data only, so the built-in token is enough; private
      # contributions are counted when they're shown on the profile.
      - name: Stats and language cards
        run: python .github/scripts/cards.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-light.svg?palette=github-light&color_snake=#C9944A
            profile/snake-dark.svg?palette=github-dark&color_snake=#C9944A

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
