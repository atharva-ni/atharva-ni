# Builds the stats, top-languages and contribution-snake images used in README.md
# and commits them to profile/. Generating them here (instead of linking to the
# public github-readme-stats server) means they never break from rate limits.

name: Profile cards

on:
  schedule:
    - cron: "30 0 * * *" # every day at 06:00 IST
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Colours match the banner: copper titles, soldermask-green icons, transparent background.
      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_border=true&bg_color=00000000&title_color=8A5A1C&text_color=24292F&icon_color=0D6B4F
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_border=true&bg_color=00000000&title_color=D9A75C&text_color=C9D4CC&icon_color=4FB08E
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # hide=html keeps static/exported HTML in website repos from drowning out
      # TypeScript and Python. Delete it if you want HTML counted.
      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=html&hide_border=true&bg_color=00000000&title_color=8A5A1C&text_color=24292F
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=html&hide_border=true&bg_color=00000000&title_color=D9A75C&text_color=C9D4CC
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-light.svg?palette=github-light&color_snake=#C9944A
            profile/snake-dark.svg?palette=github-dark&color_snake=#C9944A

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
